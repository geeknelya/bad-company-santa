<script>
(()=>{const $=s=>document.querySelector(s),data=JSON.parse(localStorage.getItem('bc_santa_demo')||'{}');let page='home',revealed=false;const save=()=>localStorage.setItem('bc_santa_demo',JSON.stringify(data));const escapeHTML=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const card=s=>'<div class="panel">'+s+'</div>';function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hide');clearTimeout(window.tt);window.tt=setTimeout(()=>$('#toast').classList.add('hide'),2600)}function go(p){page=p;$('#home').classList.toggle('hide',p!=='home');$('#page').classList.toggle('hide',p==='home');$('#nav').classList.toggle('hide',p==='home');$('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.go===p));if(p==='home')return;let h='';if(p==='join'){h='<div class="heading">🎅 Регистрация</div>'+card('<p>Присоединяйся к праздничной игре!</p><input id="name" placeholder="Как тебя зовут?" value="'+escapeHTML(data.name)+'"><button class="btn" data-action="join">🎁 '+(data.joined?'Обновить анкету':'Участвовать в игре')+'</button><p class="muted">Демо: данные сохраняются только в этом браузере.</p>')}else if(p==='wishes'){h='<div class="heading">📝 Мои пожелания</div>'+card('<p class="muted">Напиши, какие подарки тебе нравятся.</p><textarea id="wish" placeholder="Книги, игры, сладости...">'+escapeHTML(data.wish)+'</textarea><button class="btn" data-action="wish">💜 Сохранить</button>')}else if(p==='gift'){h='<div class="heading">🎁 Мой подопечный</div>'+card('<span class="gift '+(revealed?'open':'')+'">🎁</span><p style="text-align:center">'+(revealed?'Твой получатель: <b>Нелька</b><br><small>Демонстрационный пример</small>':'Открой подарок, чтобы увидеть демонстрацию жеребьёвки')+'</p><button class="btn" data-action="reveal">'+(revealed?'🤫 Скрыть имя':'✨ Открыть подарок')+'</button>')}else if(p==='messages'){h='<div class="heading">💌 Тайная почта</div>'+card('<p class="muted">Сообщения пока не отправляются в Telegram.</p><textarea id="message" placeholder="Твой Тайный Санта пишет..."></textarea><button class="btn" data-action="send">✉️ Отправить (демо)</button>')+(data.messages||[]).map(m=>card('💌 '+escapeHTML(m))).join('')}else if(p==='members'){h='<div class="heading">👥 Участники</div>'+card('<div class="stat"><div class="pill">👥 12 участников</div><div class="pill">🎄 Игра друзей</div></div>')+['Нелька','Алекс','Кристина','Макс','Аня','Дима'].map(n=>card('🎁 '+n+' <span style="float:right;color:#c69bdf">✓</span>')).join('')+'<p class="muted">Список демонстрационный.</p>'}else if(p==='dates'){h='<div class="heading">📅 Важные даты</div>'+card('<p>📝 Регистрация: 09.11–30.11</p><p>🎲 Жеребьёвка: после регистрации</p><p>🎁 Вручение: '+escapeHTML(data.date||'31.12.2026')+'</p><p>💰 Бюджет: '+escapeHTML(data.budget||3000)+' ₽</p>')}else if(p==='rules'){h='<div class="heading">❄️ Правила игры</div>'+card('<p>🎁 Каждый готовит один подарок.</p><p>🤫 Не раскрывай свою личность.</p><p>💜 Учитывай пожелания получателя.</p><p>💌 Пиши анонимные праздничные сообщения.</p><p>🎄 Соблюдай бюджет и дату вручения.</p>')}else if(p==='admin'){h='<div class="heading">👑 Панель администратора</div>'+card('<p class="muted">В прототипе доступ открыт всем. В реальном Mini App будет проверка Telegram ID на сервере.</p><label>Лимит подарка, ₽</label><input id="budget" type="number" min="0" value="'+escapeHTML(data.budget||3000)+'"><label>Дата вручения</label><input id="date" type="date" value="'+escapeHTML(data.dateISO||'2026-12-31')+'"><button class="btn" data-action="settings">💾 Сохранить настройки</button>')+'<div class="tiles"><button class="tile" data-action="draw">🎲<br>Жеребьёвка</button><button class="tile" data-action="announce">📢<br>Объявление</button></div>'}$('#content').innerHTML=h;window.scrollTo({top:0,behavior:'instant'})}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.go){go(b.dataset.go);return}switch(b.dataset.action){case'join':data.name=$('#name').value.trim();if(!data.name){toast('Введи имя');return}data.joined=true;save();toast('🎉 Ты в игре! (демо)');go('join');break;case'wish':data.wish=$('#wish').value;save();toast('💜 Пожелания сохранены');break;case'reveal':revealed=!revealed;go('gift');break;case'send':let v=$('#message').value.trim();if(!v){toast('Напиши сообщение');return}data.messages=[v,...(data.messages||[])];save();go('messages');toast('✉️ Сообщение сохранено (демо)');break;case'settings':data.budget=$('#budget').value;data.dateISO=$('#date').value;data.date=data.dateISO.split('-').reverse().join('.');save();toast('⚙️ Настройки сохранены');break;case'draw':toast('🎲 Демо: открой раздел «Мой подопечный»');break;case'announce':toast('📢 Рассылка появится после подключения сервера');break}});const snow=$('#snow');for(let i=0;i<27;i++){let s=document.createElement('span');s.className='flake';s.textContent=i%3===0?'❄':'✦';s.style.left=Math.random()*100+'%';s.style.fontSize=(5+Math.random()*10)+'px';s.style.animationDuration=(9+Math.random()*14)+'s';s.style.animationDelay=(-Math.random()*20)+'s';snow.appendChild(s)}if(window.Telegram?.WebApp){window.Telegram.WebApp.ready();window.Telegram.WebApp.expand()}go('home')})();
</script></body></html>
