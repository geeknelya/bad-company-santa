put,textarea{display:block;width:100%;border-radius:12px;border:1px solid #9745c3;background:#13091e;color:white;padding:12px;margin:9px 0}textarea{min-height:115px;resize:vertical}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);background:#0b0519f5;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid #a23bd8;z-index:20;padding:7px 2px max(9px,env(safe-area-inset-bottom))}.nav button{border:0;background:transparent;padding:5px 0;font-size:10px}.nav button b{display:block;font-size:22px}.nav button.active{border-radius:12px;background:#67219d;box-shadow:0 0 12px #b538f2}.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{border:1px solid #a34cdb;background:#2b1042;padding:20px 6px;border-radius:15px;box-shadow:0 0 10px #9b30cc66}.stat{display:flex;justify-content:space-between;gap:10px}.pill{border:1px solid #b74beb;padding:9px;border-radius:12px;flex:1;text-align:center;font-size:12px}.gift{font-size:92px;display:block;text-align:center;filter:drop-shadow(0 0 22px #be4af9);animation:bob 2.4s ease-in-out infinite}.gift.open{animation:shake .5s ease-in-out}.toast{position:fixed;z-index:30;bottom:85px;left:50%;transform:translateX(-50%);width:min(90%,380px);border:1px solid #da79ff;background:#35114f;padding:12px;border-radius:14px;text-align:center;box-shadow:0 0 20px #a52deb}.hide{display:none!important}@keyframes fall{to{transform:translate3d(28px,1650px,0) rotate(240deg)}}@keyframes twinkle{to{opacity:.25;box-shadow:0 0 5px 2px #ffa946}}@keyframes glow{50%{filter:brightness(1.35);box-shadow:0 0 24px #e254ff}}@keyframes bob{50%{transform:translateY(-10px) rotate(3deg)}}@keyframes shake{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}

/* Живые элементы внутри иллюстрации — декоративные слои поверх исходного рисунка */
.hero-art{position:relative;isolation:isolate}
.art-effects{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.art-light{position:absolute;width:3.3%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,#fffde5 0%,#ffe7a2 12%,#ffc25377 29%,#ffae3d00 70%);mix-blend-mode:screen;animation:lanternFlicker var(--dur,2.6s) ease-in-out infinite alternate;animation-delay:var(--delay,0s)}
.art-light.lantern{width:14%;background:radial-gradient(ellipse,#ffe7a088,#ffa32144 23%,transparent 65%);filter:blur(5px)}
.art-light.purple{width:12%;background:radial-gradient(circle,#ec98ff88,#9f29ec55 24%,transparent 68%);filter:blur(4px)}

.art-breath{position:absolute;left:36%;top:22%;width:27%;height:49%;border-radius:45%;background:radial-gradient(ellipse,#f9b3ff17,transparent 70%);mix-blend-mode:screen;animation:softBreath 5s ease-in-out infinite}
@keyframes lanternFlicker{0%,18%,56%,100%{opacity:.4;transform:translate(-50%,-50%) scale(.8)}30%,65%{opacity:1;transform:translate(-50%,-50%) scale(1.4)}}
45%,47%{opacity:.95;transform:translate(-50%,-50%) scaleY(1)}}
@keyframes softBreath{50%{opacity:.4;transform:scale(1.025)}}

</style><style>.event-fixed{position:relative;padding:12px 14px 14px;background:linear-gradient(#1d082b,#260735 55%,#14051f);border-top:2px solid #8c24b3;text-align:center}.event-stats{display:flex;gap:6px}.event-stat{flex:1;min-width:0;border:1px solid #d04cff;border-radius:14px;padding:9px 3px;font-size:clamp(10px,2.6vw,13px);background:#240b32;box-shadow:0 0 10px #9f35dc66}.event-stat strong{display:block;font-size:clamp(13px,3.8vw,18px);margin-top:4px}.event-count-label{font-weight:700;margin:14px 0 9px;font-size:clamp(12px,3.4vw,16px)}.event-clock{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.event-clock span{border:1px solid #a63ee1;border-radius:12px;padding:8px 0;font-size:11px;background:#2d0b41}.event-clock b{display:block;font-size:25px;color:white}.join-main{width:100%;border:2px solid #e183ff;border-radius:30px;padding:14px 6px;margin-top:14px;background:linear-gradient(90deg,#7214ac,#c83af5,#7413aa);font-size:clamp(16px,4.8vw,23px);font-weight:800;box-shadow:0 0 18px #b53afa}.bottom-art{position:relative}.bottom-art .hot{z-index:5}.snow{height:100%;pointer-events:none}.hero{overflow:hidden}.poster{vertical-align:top}</style><style>
/* Живая праздничная анимация */
.event-fixed{isolation:isolate;overflow:hidden}
.event-fixed:before{content:"";position:absolute;inset:-45%;pointer-events:none;z-index:-1;background:radial-gradient(circle at 50% 50%,#b52bff40,transparent 38%);animation:aurora 5s ease-in-out infinite alternate}
.event-stat{animation:cardGlow 3.2s ease-in-out infinite alternate;transition:transform .2s}
.event-stat:nth-child(2){animation-delay:.6s}.event-stat:nth-child(3){animation-delay:1.2s}
.event-stat:active{transform:scale(.96)}
.join-main{position:relative;overflow:hidden;animation:buttonBreath 2.4s ease-in-out infinite;transition:transform .18s}
.join-main:active{transform:scale(.96)}
.join-main:after{content:"";position:absolute;top:-50%;left:-50%;width:30%;height:200%;background:linear-gradient(90deg,transparent,#fff8,transparent);transform:rotate(25deg);animation:shine 4.5s ease-in-out infinite;pointer-events:none}
.event-clock span{animation:clockGlow 3s ease-in-out infinite alternate}
.event-clock span:nth-child(2){animation-delay:.4s}.event-clock span:nth-child(3){animation-delay:.8s}.event-clock span:nth-child(4){animation-delay:1.2s}
.flake{will-change:transform;filter:drop-shadow(0 0 5px #d6a0ff)}
.bottom-art{animation:softFloat 6s ease-in-out infinite alternate}
.sparkle-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:6}
.sparkle{position:absolute;color:#fff;animation:sparkle 2.5s ease-in-out infinite;filter:drop-shadow(0 0 5px #e37aff)}
@keyframes aurora{to{transform:translate(12%,8%) scale(1.25);opacity:.55}}
@keyframes cardGlow{to{box-shadow:0 0 20px #c65affaa,inset 0 0 12px #ad33ef33;border-color:#f0b3ff}}
@keyframes buttonBreath{50%{box-shadow:0 0 30px #db54ff,0 0 48px #9820dd99;filter:brightness(1.16)}}
@keyframes shine{0%,60%{left:-55%}90%,100%{left:140%}}
@keyframes clockGlow{to{box-shadow:inset 0 0 15px #a03bdb66,0 0 12px #a03bdb88}}
@keyframes softFloat{to{filter:brightness(1.1)}}
@keyframes sparkle{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1.3) rotate(90deg)}}
@media(prefers-reduced-motion:reduce){.event-fixed:before,.event-stat,.join-main,.join-main:after,.event-clock span,.bottom-art,.sparkle{animation:none!important}}

@keyframes santaBounce{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-10px) rotate(-5deg)}50%{transform:translateY(0) rotate(3deg)}74%{transform:translateY(-5px) rotate(-2deg)}}
@keyframes reindeerWiggle{0%,100%{transform:rotate(0)}23%{transform:rotate(-6deg)}47%{transform:rotate(6deg)}73%{transform:rotate(-3deg)}}
@keyframes elfDance{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-6px) rotate(6deg)}50%{transform:translateY(-1px) rotate(-5deg)}74%{transform:translateY(-7px) rotate(4deg)}}
.live-character:after{content:'✦';position:absolute;left:50%;top:0;opacity:0;color:#fff0ff;text-shadow:0 0 12px #df54ff;font-size:22px;pointer-events:none}

<script>
(()=>{const $=s=>document.querySelector(s),data=JSON.parse(localStorage.getItem('bc_santa_demo')||'{}');let page='home',revealed=false;const save=()=>localStorage.setItem('bc_santa_demo',JSON.stringify(data));const escapeHTML=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const card=s=>'<div class="panel">'+s+'</div>';function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hide');clearTimeout(window.tt);window.tt=setTimeout(()=>$('#toast').classList.add('hide'),2600)}function go(p){page=p;$('#home').classList.toggle('hide',p!=='home');$('#page').classList.toggle('hide',p==='home');$('#nav').classList.toggle('hide',p==='home');$('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.go===p));if(p==='home')return;let h='';if(p==='join'){h='<div class="heading">🎅 Регистрация</div>'+card('<p>Присоединяйся к праздничной игре!</p><input id="name" placeholder="Как тебя зовут?" value="'+escapeHTML(data.name)+'"><button class="btn" data-action="join">🎁 '+(data.joined?'Обновить анкету':'Участвовать в игре')+'</button><p class="muted">Демо: данные сохраняются только в этом браузере.</p>')}else if(p==='wishes'){h='<div class="heading">📝 Мои пожелания</div>'+card('<p class="muted">Напиши, какие подарки тебе нравятся.</p><textarea id="wish" placeholder="Книги, игры, сладости...">'+escapeHTML(data.wish)+'</textarea><button class="btn" data-action="wish">💜 Сохранить</button>')}else if(p==='gift'){h='<div class="heading">🎁 Мой подопечный</div>'+card('<span class="gift '+(revealed?'open':'')+'">🎁</span><p style="text-align:center">'+(revealed?'Твой получатель: <b>Нелька</b><br><small>Демонстрационный пример</small>':'Открой подарок, чтобы увидеть демонстрацию жеребьёвки')+'</p><button class="btn" data-action="reveal">'+(revealed?'🤫 Скрыть имя':'✨ Открыть подарок')+'</button>')}else if(p==='messages'){h='<div class="heading">💌 Тайная почта</div>'+card('<p class="muted">Сообщения пока не отправляются в Telegram.</p><textarea id="message" placeholder="Твой Тайный Санта пишет..."></textarea><button class="btn" data-action="send">✉️ Отправить (демо)</button>')+(data.messages||[]).map(m=>card('💌 '+escapeHTML(m))).join('')}else if(p==='members'){h='<div class="heading">👥 Участники</div>'+card('<div class="stat"><div class="pill">👥 Без лимита участников</div><div class="pill">🎄 Игра друзей</div></div>')+['Нелька','Алекс','Кристина','Макс','Аня','Дима'].map(n=>card('🎁 '+n+' <span style="float:right;color:#c69bdf">✓</span>')).join('')+'<p class="muted">Список демонстрационный.</p>'}else if(p==='dates'){h='<div class="heading">📅 Важные даты</div>'+card('<p>📝 Регистрация: до 30.11.2026</p><p>🎲 Жеребьёвка: 01.12.2026 в 00:00 МСК</p><p>🎁 Вручение: до 30.12.2026</p><p>💰 Подарок: от 2 000 ₽, без верхнего лимита</p>')}else if(p==='rules'){h='<div class="heading">❄️ Правила игры</div>'+card('<p>🎁 Каждый готовит один подарок.</p><p>🤫 Не раскрывай свою личность.</p><p>💜 Учитывай пожелания получателя.</p><p>💌 Пиши анонимные праздничные сообщения.</p><p>🎄 Соблюдай бюджет и дату вручения.</p>')}else if(p==='admin'){h='<div class="heading">👑 Панель администратора</div>'+card('<p class="muted">В прототипе доступ открыт всем. В реальном Mini App будет проверка Telegram ID на сервере.</p><label>Лимит подарка, ₽</label><input id="budget" type="number" min="0" value="'+escapeHTML(data.budget||3000)+'"><label>Дата вручения</label><input id="date" type="date" value="'+escapeHTML(data.dateISO||'2026-12-31')+'"><button class="btn" data-action="settings">💾 Сохранить настройки</button>')+'<div class="tiles"><button class="tile" data-action="draw">🎲<br>Жеребьёвка</button><button class="tile" data-action="announce">📢<br>Объявление</button></div>'}$('#content').innerHTML=h;window.scrollTo({top:0,behavior:'instant'})}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.go){go(b.dataset.go);return}switch(b.dataset.action){case'join':data.name=$('#name').value.trim();if(!data.name){toast('Введи имя');return}data.joined=true;save();toast('🎉 Ты в игре! (демо)');go('join');break;case'wish':data.wish=$('#wish').value;save();toast('💜 Пожелания сохранены');break;case'reveal':revealed=!revealed;go('gift');break;case'send':let v=$('#message').value.trim();if(!v){toast('Напиши сообщение');return}data.messages=[v,...(data.messages||[])];save();go('messages');toast('✉️ Сообщение сохранено (демо)');break;case'settings':data.budget=$('#budget').value;data.dateISO=$('#date').value;data.date=data.dateISO.split('-').reverse().join('.');save();toast('⚙️ Настройки сохранены');break;case'draw':toast('🎲 Демо: открой раздел «Мой подопечный»');break;case'announce':toast('📢 Рассылка появится после подключения сервера');break}});const snow=$('#snow');for(let i=0;i<27;i++){let s=document.createElement('span');s.className='flake';s.textContent=i%3===0?'❄':'✦';s.style.left=Math.random()*100+'%';s.style.fontSize=(5+Math.random()*10)+'px';s.style.animationDuration=(9+Math.random()*14)+'s';s.style.animationDelay=(-Math.random()*20)+'s';snow.appendChild(s)}if(window.Telegram?.WebApp){window.Telegram.WebApp.ready();window.Telegram.WebApp.expand()}go('home')})();
</script><script>
(()=>{
 const target=Date.parse('2026-11-30T21:00:00Z'); // 01.12.2026 00:00 МСК
 const clock=document.querySelector('#countdown');
 function updateClock(){if(!clock)return;const remaining=Math.max(0,target-Date.now());let t=Math.floor(remaining/1000);const d=Math.floor(t/86400);t%=86400;const h=Math.floor(t/3600);t%=3600;const m=Math.floor(t/60);const sec=t%60;const nums=[d,h,m,sec];clock.querySelectorAll('b').forEach((el,i)=>el.textContent=String(nums[i]).padStart(2,'0'));const label=document.querySelector('.event-count-label');if(label&&remaining===0)label.textContent='🎲 Время жеребьёвки наступило · 01.12.2026, 00:00 МСК'}
 updateClock();setInterval(updateClock,1000);
 const home=document.querySelector('#home');if(home){const layer=document.createElement('div');layer.className='sparkle-layer';for(let i=0;i<22;i++){const star=document.createElement('span');star.className='sparkle';star.textContent=i%3?'✦':'✧';star.style.left=(3+(i*43)%94)+'%';star.style.top=(2+(i*29)%94)+'%';star.style.fontSize=(9+i%9)+'px';star.style.animationDelay=-(i*.41)+'s';star.style.animationDuration=(2+i%4*.7)+'s';layer.appendChild(star)}home.appendChild(layer)}
})();
</script><script>document.querySelectorAll('.live-character').forEach((el)=>{let timer;const trigger=()=>{clearTimeout(timer);el.classList.remove('play');void el.offsetWidth;el.style.setProperty('--dance',el.dataset.motion);el.classList.add('play');timer=setTimeout(()=>el.classList.remove('play'),1500)};el.addEventListener('click',trigger);});</script></body></html>
